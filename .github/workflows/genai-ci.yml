name: GenAI CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/genai-ci.yml"
      - "page_generation/**"
      - "chat_bot/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/genai-ci.yml"
      - "page_generation/**"
      - "chat_bot/**"

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}

jobs:
  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: page-generation
            working-directory: page_generation
            python-version: "3.13"
          - service: chatbot-api
            working-directory: chat_bot
            python-version: "3.11"

    defaults:
      run:
        working-directory: ${{ matrix.working-directory }}

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            ${{ matrix.working-directory }}/requirements*.txt
            ${{ matrix.working-directory }}/uv.lock

      - name: Install page-generation dependencies
        if: matrix.service == 'page-generation'
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv==0.11.4
          uv sync --locked --extra dev --no-install-project --python "${{ matrix.python-version }}"

      - name: Install chatbot dependencies
        if: matrix.service == 'chatbot-api'
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir \
            torch==2.6.0 \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir -r requirements-dev.txt

      - name: Run service tests
        id: tests
        run: |
          if [ "${{ matrix.service }}" = "page-generation" ]; then
            uv run --project . pytest -q
          else
            # These three regression cases intentionally call a real Ollama
            # instance; CI has no LLM service, so the deterministic suite
            # excludes only tests whose name explicitly ends in real_llm.
            python -m pytest -q -k 'not real_llm'
          fi

      - name: Write test result to Summary
        if: always()
        env:
          SERVICE: ${{ matrix.service }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          {
            printf '### %s tests\n' "$SERVICE"
            printf '| Source SHA | `%s` |\n' "$SOURCE_SHA"
            printf '| Runner | `%s` |\n' "$RUNNER_NAME"
            printf '| Result | `%s` |\n' "${{ steps.tests.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"

  docker-validate:
    name: Docker validation ${{ matrix.service }}
    if: github.event_name == 'pull_request' && needs.test.result == 'success'
    needs: test
    runs-on: ${{ matrix.service == 'chatbot-api' && 'ubuntu-24.04' || format('codebuild-jangin-genai-runner-{0}-{1}', github.run_id, github.run_attempt) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: page-generation
            context: ./page_generation
            dockerfile: ./page_generation/deploy/sglang/Dockerfile
            min-free-gib: 35
          - service: chatbot-api
            context: ./chat_bot
            dockerfile: ./chat_bot/Dockerfile
            min-free-gib: 10
          - service: chatbot-llm
            context: ./chat_bot/deploy/ollama
            dockerfile: ./chat_bot/deploy/ollama/Dockerfile
            min-free-gib: 35

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Validate Dockerfile definition
        env:
          CONTEXT: ${{ matrix.context }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: docker buildx build --check --platform linux/amd64 --file "$DOCKERFILE" "$CONTEXT"

      # page-generation은 lmsysorg/sglang 베이스 이미지, chatbot-llm은 ollama/ollama
      # 베이스에 gemma4:12b 모델을 빌드 시점에 구워 넣어서 둘 다 10 GiB를 넘는 대형
      # 이미지다(2026-09-28 SGLang→Ollama 전환 — T4 공유 메모리 한도 문제로 SGLang
      # 서빙 불가 확인). CodeBuild 러너에서도 용량 부족은 검증 실패로 처리한다.
      - name: Check PR build capacity
        env:
          REQUIRED_GIB: ${{ matrix.min-free-gib }}
          SERVICE: ${{ matrix.service }}
        run: |
          free_gib="$(df --output=avail -BG "$GITHUB_WORKSPACE" | tail -n 1 | tr -dc '0-9')"
          {
            printf '### %s PR build capacity\n' "$SERVICE"
            printf '| Required free storage | `%s GiB` |\n' "$REQUIRED_GIB"
            printf '| Available storage | `%s GiB` |\n' "$free_gib"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$free_gib" -lt "$REQUIRED_GIB" ]; then
            {
              printf '| Full image build | `failed: insufficient free storage` |\n'
              printf '\n> **Error:** full %s image build cannot run because this runner has less than %s GiB free.\n' "$SERVICE" "$REQUIRED_GIB"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::${SERVICE} requires at least ${REQUIRED_GIB} GiB free, but the runner has ${free_gib} GiB."
            exit 1
          fi

      - name: Build image without push
        env:
          CONTEXT: ${{ matrix.context }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: docker buildx build --platform linux/amd64 --progress=plain --file "$DOCKERFILE" "$CONTEXT"

  publish:
    name: Publish ${{ matrix.service }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.test.result == 'success'
    needs: test
    concurrency:
      group: genai-publish-${{ github.sha }}-${{ matrix.service }}
      cancel-in-progress: false
    runs-on: ${{ matrix.service == 'chatbot-api' && 'ubuntu-24.04' || format('codebuild-jangin-genai-runner-{0}-{1}', github.run_id, github.run_attempt) }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: page-generation
            context: ./page_generation
            dockerfile: ./page_generation/deploy/sglang/Dockerfile
            repository: jangin-ai/page-generation
            min-free-gib: 35
          - service: chatbot-api
            context: ./chat_bot
            dockerfile: ./chat_bot/Dockerfile
            repository: jangin-ai/chatbot-api
            min-free-gib: 10
          - service: chatbot-llm
            context: ./chat_bot/deploy/ollama
            dockerfile: ./chat_bot/deploy/ollama/Dockerfile
            repository: jangin-ai/chatbot-llm
            min-free-gib: 35

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Check runner storage
        env:
          REQUIRED_GIB: ${{ matrix.min-free-gib }}
          SERVICE: ${{ matrix.service }}
        run: |
          free_gib="$(df --output=avail -BG "$GITHUB_WORKSPACE" | tail -n 1 | tr -dc '0-9')"
          {
            printf '### %s build capacity\n' "$SERVICE"
            printf '| Required free storage | `%s GiB` |\n' "$REQUIRED_GIB"
            printf '| Available storage | `%s GiB` |\n' "$free_gib"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$free_gib" -lt "$REQUIRED_GIB" ]; then
            {
              printf '\n> **Build stopped before ECR authentication.** The runner has less than the required free storage. Use a larger or self-hosted runner for this image.\n'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::${SERVICE} requires at least ${REQUIRED_GIB} GiB free, but the runner has ${free_gib} GiB."
            exit 1
          fi

      - name: Validate AWS role variable
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          if [ -z "$AWS_ROLE_ARN" ]; then
            echo "::error::Actions variable AWS_ROLE_ARN is not set by Infra."
            exit 1
          fi

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Check immutable source-SHA tag
        id: existing
        env:
          REPOSITORY: ${{ matrix.repository }}
        shell: bash
        run: |
          set -euo pipefail
          error_file="$(mktemp)"
          if digest="$(aws ecr describe-images \
              --repository-name "$REPOSITORY" \
              --image-ids "imageTag=$GITHUB_SHA" \
              --region "$AWS_REGION" \
              --query 'imageDetails[0].imageDigest' \
              --output text 2>"$error_file")"; then
            if [ -n "$digest" ] && [ "$digest" != "None" ]; then
              printf 'exists=true\n' >> "$GITHUB_OUTPUT"
              printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
              rm -f "$error_file"
              exit 0
            fi
          fi

          if grep -q 'ImageNotFoundException' "$error_file"; then
            printf 'exists=false\n' >> "$GITHUB_OUTPUT"
            rm -f "$error_file"
            exit 0
          fi

          cat "$error_file" >&2
          rm -f "$error_file"
          echo "::error::ECR tag lookup failed for $REPOSITORY:$GITHUB_SHA."
          exit 1

      - name: Build and push immutable image
        id: image
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ matrix.repository }}:${{ github.sha }}

      - name: Show published or reused image digest
        env:
          SERVICE: ${{ matrix.service }}
          REPOSITORY: ${{ matrix.repository }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          EXISTING: ${{ steps.existing.outputs.exists }}
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
          PUSHED_DIGEST: ${{ steps.image.outputs.digest }}
          TEST_RESULT: ${{ needs.test.result }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EXISTING" = "true" ]; then
            digest="$EXISTING_DIGEST"
            disposition="reused-existing-immutable-tag"
          else
            digest="$PUSHED_DIGEST"
            disposition="pushed"
          fi
          if [ -z "$digest" ]; then
            echo "::error::No image digest was returned for $SERVICE."
            exit 1
          fi
          {
            printf '### %s\n' "$SERVICE"
            printf '| Image | `%s/%s@%s` |\n' "$REGISTRY" "$REPOSITORY" "$digest"
            printf '| Source SHA | `%s` |\n' "$SOURCE_SHA"
            printf '| Run | %s |\n' "$RUN_URL"
            printf '| Test result | `%s` |\n' "$TEST_RESULT"
            printf '| Publish disposition | `%s` |\n' "$disposition"
          } >> "$GITHUB_STEP_SUMMARY"
